[workspace]
members = [
    "programs/elastic_treasury",
    "programs/gatekeeper_hook",
    "programs/custom_amm",
]
# Separate workspace: its LiteSVM/test-kit dependency tree is host-only and must
# not constrain the on-chain programs' resolution.
exclude = ["custom-amm-sdk"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

# PLAN.md §0.2: pin every version. Caret ranges silently let Anchor 1.1 -> 1.2 and
# spl-token-2022 11 -> 12 through under the same CLI, which is how CPI helpers
# disappear without any visible change in the diff.
[workspace.dependencies]
anchor-lang = "=1.1.2"
anchor-spl = "=1.1.2"
spl-token-2022-interface = "=2.0.0"
# 1.25 is the floor required by spl-list-view (via spl-tlv-account-resolution).
bytemuck = { version = "=1.25.2", features = ["derive"] }
# Gatekeeper transfer hook. 2.1.0 is the first release on the solana-* 3.0
# cohort that anchor-lang 1.1.2 pins (verified: it depends on solana-account-info
# / solana-cpi / solana-instruction 3.0.0, spl-tlv-account-resolution 0.11.0).
spl-transfer-hook-interface = "=2.1.0"
spl-tlv-account-resolution = "=0.11.4"

# Dev-only.
proptest = "=1.9.0"
# For tests/idl_is_stable.rs, which pins the generated IDL to errors.rs.
serde_json = "=1.0.151"

# PLAN.md §0.4: overflow checks must be ON in release. A Solana program that
# wraps silently on a fee calculation is a protocol drain.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[package]
name = "custom-amm-sdk"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.89.0"

[lib]
name = "custom_amm_sdk"
path = "src/lib.rs"

[workspace]
resolver = "3"

[dependencies]
jupiter-amm-interface = { git = "https://github.com/jup-ag/jupiter-amm-interface", rev = "95bd18485e580625a39eb92a0c0ad2061579daad" }
# Pinned to the cohort whose `solana-clock` requirement is `>=3.1.1, <3.2.0`;
# newer solana-account pulls the `solana-clock 3.2.x` shim that re-exports
# solana-clock 4.0.0 (wincode 0.6), which is incompatible with LiteSVM's 0.5.
solana-account = { version = "=4.3.2", features = ["serde"] }
solana-clock = "=3.1.1"
solana-instruction = "3"
# `curve25519` enables host-side `find_program_address` (off-curve PDA checks).
solana-pubkey = { version = "4", features = ["curve25519"] }

[dev-dependencies]
# LiteSVM 0.14 is only source-compatible with the agave 4.1/4.2 cohort (4.3.0
# changed `solana-transaction-context`/`solana-svm-transaction` layouts and
# requires rustc 1.97.1). Pinning these floors keeps the whole agave/solana
# runtime family on wincode 0.5.x.
agave-feature-set = "=4.1.1"
# LiteSVM 0.14 pins `wincode = "0.5.5"`; any solana-* crate that resolves to a
# build using wincode 0.6 fails to satisfy `SchemaRead`. Pin each direct
# wincode dependant to the 0.5.5 cohort (versions from LiteSVM's own lockfile).
solana-epoch-rewards = "=3.1.0"
solana-epoch-schedule = "=3.2.0"
solana-fee-calculator = "=3.2.2"
solana-hash = "=4.5.0"
solana-last-restart-slot = "=3.1.0"
solana-nonce = "=3.2.0"
solana-nonce-account = "=4.1.1"
solana-rent = "=4.3.0"
solana-short-vec = "=3.2.2"
solana-signature = "=3.4.1"
solana-slot-hashes = "=3.1.0"
solana-slot-history = "=3.1.0"
solana-sysvar = "=4.1.0"
jupiter-amm-test-kit = { git = "https://github.com/jup-ag/jupiter-amm-interface", rev = "95bd18485e580625a39eb92a0c0ad2061579daad" }
litesvm = "0.14.0"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode"] }
solana-compute-budget-interface = "3"
bincode = "1.3"
